name: Release Lightee

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron dependencies
        run: npm ci
        working-directory: apps/electron

      # 发布判定（specs/release-hardening.md §1）：类型检查 + 全部单测 + 真实 Electron 门禁。
      # 根 test/typecheck 已包含 apps/electron（RH-09），因此这里不再单独跑一遍。
      - name: Typecheck (core + engine + electron)
        run: pnpm typecheck

      - name: Test (core + engine + electron)
        run: pnpm test

      - name: Release gate (real Electron)
        run: npm run verify:release:workflow
        working-directory: apps/electron

      # 这一步**不能**拿到 GH_TOKEN。electron-builder 的 package.json 里配了 github
      # publish provider，一旦环境里有 token，打 tag 的构建它就会自己建 release 并上传，
      # 而且是打完包**立刻**传，排在 check:asar 之前——产物还没验就已经公开了。
      # 顺序必须是「先验产物，再上传」，所以发布权只留给最后一步。
      - name: Package
        run: npm run package:win
        working-directory: apps/electron

      # 不带 tag 条件：workflow_dispatch 打包演练时也要能看到这一步的输出，
      # 免得校验和文件本身的问题（比如漏了某个产物）要等到真正发布才发现。
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        working-directory: apps/electron/release
        run: |
          $files = Get-ChildItem -File | Where-Object { $_.Name -match '^Lightee-.*\.(exe|zip|blockmap)$' -or $_.Name -eq 'latest.yml' }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content SHA256SUMS.txt

      # 草稿发布：资产就位、正文空白，由人写完发布说明再手动 Publish。
      # generate_release_notes 关掉——自动生成的是提交列表，那是开发过程，不是给用户看的东西。
      # 文件逐个列出，不用 *.yml 通配：那会把 builder-debug.yml（electron-builder 的配置
      # dump，纯调试残渣）一起传上去。latest.yml 和 .blockmap 必须留，前者是自动更新的
      # 版本清单，后者让升级只下差分而不是重下整包。
      # 只有打 tag 才上传。workflow_dispatch 手动触发时跳过这一步，于是手动触发就是
      # 一次纯粹的「打包能不能过」演练——CI 平时不打包，打包链路只在发布当天才第一次
      # 执行，这条给了在那之前试跑的办法。
      - name: Upload draft release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/electron/release/Lightee-*-setup.exe
            apps/electron/release/Lightee-*-portable.exe
            apps/electron/release/Lightee-*-win-x64.zip
            apps/electron/release/Lightee-*-setup.exe.blockmap
            apps/electron/release/latest.yml
            apps/electron/release/SHA256SUMS.txt
          draft: true
          generate_release_notes: false
