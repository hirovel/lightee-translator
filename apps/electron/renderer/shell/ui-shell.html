<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightee TUI — 主界面定案</title>
<style>
/* `hidden` 属性只是让 UA 样式表加上 display:none，作者层任何一条 display 都能盖掉它。
   本文件里已经踩过两次（.ai-md 的 display:grid、#ai-quick 的 display:flex）：属性设了、
   元素照样占位，表现为「收不起来的空框」。这条把它钉死，免得每加一条 display 就复发一次。 */
[hidden]{display:none!important}
:root{
  --bg:#111719;--panel:#192124;--panel2:#242f33;
  --border:#35444a;--border2:#526269;
  --text:#edf1ea;--dim:#a8b5ad;--dimmer:#78868b;
  --accent:#c1d6bd;--accent2:#d79a7f;
  --green:#a5cda9;--yellow:#d9ba78;--red:#dd9990;--blue:#a6bdc8;
  --mono:'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#070b0e;
  color:var(--text);font-family:var(--mono);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
}
.terminal{
  width:min(1200px,100%);background:var(--bg);
  border:1px solid var(--border2);border-radius:12px;
  box-shadow:0 10px 60px rgba(0,0,0,.6);overflow:hidden;
}
.term-titlebar{
  display:flex;align-items:center;gap:8px;padding:7px 16px;
  background:var(--panel);border-bottom:1px solid var(--border2);font-size:13px;
}
.dot{width:10px;height:10px;border-radius:50%}
.dot.r{background:#f87171}.dot.y{background:#fbbf24}.dot.g{background:#4ade80}
.term-title{color:var(--dim);margin-left:10px}
.term-title b{color:var(--accent)}
.term-body{height:calc(100vh - 105px);min-height:480px;display:flex;overflow:hidden}
/* v49: 两页视口统一——窗口缩小 → 内容区自动滚动（欢迎屏卡片流/工作台三区）*/

/* ===== 主界面 B：三区 ===== */
.main{display:flex;width:100%}

/* 左栏：章节 */
.side{width:300px;border-right:1px solid var(--border2);display:flex;flex-direction:column;background:var(--panel)}
.side .head{padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--accent);letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.side .list{flex:1;overflow:auto;padding:4px 0}
.item{padding:6px 12px;font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer}
.item.sel{background:linear-gradient(90deg,rgba(125,211,252,.12),transparent);border-left:3px solid var(--accent)}
.item.glow{border-left:3px solid var(--yellow);animation:borderFlow 1.5s linear infinite}
.item .st{margin-left:auto;font-size:11px}
@keyframes borderFlow{0%{box-shadow:inset 3px 0 0 rgba(251,191,36,.3)}50%{box-shadow:inset 3px 0 0 rgba(251,191,36,.9)}100%{box-shadow:inset 3px 0 0 rgba(251,191,36,.3)}}
.side .foot{border-top:1px solid var(--border);padding:8px 14px;font-size:11px;color:var(--dim)}

/* 中栏：双语对照 */
.center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.tabs{display:flex;border-bottom:1px solid var(--border2);font-size:13px}
.tab{padding:8px 16px;color:var(--dim);cursor:pointer;border-right:1px solid var(--border)}
.tab.on{color:var(--accent);background:rgba(125,211,252,.06);box-shadow:inset 0 -2px 0 var(--accent)}
.content{flex:1;padding:14px 18px;overflow:auto}
.bl-row{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid rgba(46,58,82,.4)}
.bl-ja{color:var(--dimmer);font-size:13px}
.bl-zh{color:var(--text);font-size:14px}
.bl-zh .hl{color:var(--green)}
.type-cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}

/* 右栏：状态仪表（瘦身版）*/
.insp{width:260px;border-left:1px solid var(--border2);background:var(--panel);display:flex;flex-direction:column;overflow:auto}
.insp .sec{padding:9px 12px;border-bottom:1px solid var(--border)}
.insp .sec-t{font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:6px}
.gbar{height:6px;background:var(--panel2);border:1px solid var(--border2);border-radius:2px;overflow:hidden}
.gfill{height:100%;transition:width .4s}
.gfill.green{background:linear-gradient(90deg,#166534,#4ade80)}
.gfill.blue{background:linear-gradient(90deg,#1e3a5f,#60a5fa)}
.gfill.yellow{background:linear-gradient(90deg,#78350f,#fbbf24)}
.gfill.pink{background:linear-gradient(90deg,#701a75,#f472b6)}
.glabel{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:2px}
.agent-row{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:4px}
.agent-row .aname{width:84px;color:var(--accent)}
.agent-row .abar{flex:1;height:5px;background:var(--panel2);border:1px solid var(--border2);border-radius:2px;overflow:hidden}
.agent-row .afill{height:100%;transition:width .3s}
.afill.t1{background:linear-gradient(90deg,#701a75,#f472b6)}
.afill.t2{background:linear-gradient(90deg,#166534,#4ade80)}
.afill.t3{background:linear-gradient(90deg,#1e3a5f,#60a5fa)}
.agent-row .apct{width:32px;text-align:right;font-size:10px;color:var(--dim)}
.agent-row.done .apct{color:var(--green)}
.agent-row.waiting{opacity:.4}
.slots{display:flex;flex-direction:column;gap:4px}
.slot{font-size:10px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.slot .sbar{width:60%;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
.slot .sfill{height:100%;background:var(--yellow);transition:width .3s}
.voice-badges{display:flex;flex-direction:column;gap:3px}
.vbadge{font-size:10px;color:var(--dim);display:flex;justify-content:space-between}
.vbadge .vn{color:var(--accent)}
.vbadge .vp{color:var(--accent2)}
.nf-row{display:flex;gap:8px;font-size:11px;padding:2px 0;border-bottom:1px dashed rgba(46,58,82,.3)}
.nf-k{width:52px;color:var(--accent2);flex-shrink:0}
.nf-v{color:var(--dim)}
.cpu-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.cpu-n{width:34px;font-size:10px;color:var(--accent)}
.cpu-bar{flex:1;height:7px;background:var(--panel2);border:1px solid var(--border2);border-radius:2px;overflow:hidden}
.cpu-fill{height:100%;transition:width .4s}
.cpu-fill.pink{background:linear-gradient(90deg,#701a75,#f472b6)}
.cpu-fill.green{background:linear-gradient(90deg,#166534,#4ade80)}
.cpu-fill.blue{background:linear-gradient(90deg,#1e3a5f,#60a5fa)}
.cpu-fill.yellow{background:linear-gradient(90deg,#78350f,#fbbf24)}
.cpu-p{width:36px;text-align:right;font-size:10px;color:var(--dim)}

/* 底部状态条 */
.statusbar{display:flex;align-items:center;gap:14px;padding:7px 16px;border-top:1px solid var(--border2);background:var(--panel);font-size:11px;color:var(--dim)}
.chip{padding:0 8px;border-radius:3px;font-size:10px;border:1px solid}
.chip.ok{color:var(--green);border-color:rgba(74,222,128,.4)}
.chip.warn{color:var(--yellow);border-color:rgba(251,191,36,.4)}
.chip.info{color:var(--blue);border-color:rgba(96,165,250,.4)}
.event-stream{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev.ok{color:var(--green)}.ev.act{color:var(--accent)}.ev.warn{color:var(--yellow)}
kbd{font-family:var(--mono);font-size:10px;background:var(--panel2);border:1px solid var(--border2);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--accent)}

/* 底部状态右侧快捷键 */
.keys{display:flex;gap:10px;align-items:center}

.sys-agent{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--dim)}
.sys-pct{color:var(--text);font-size:11px}
.sys-sep{width:1px;height:14px;background:var(--border2);margin:0 4px;display:inline-block}
.footer{min-height:30px;align-items:center}

.cache-group{display:inline-flex;align-items:center;gap:8px}
.cache-item{display:inline-flex;align-items:center;gap:3px;cursor:help}
.cache-label{font-size:10px;color:var(--dimmer)}
.cache-bar.mini{width:30px;height:6px;background:var(--panel2);border:1px solid var(--border2);border-radius:3px;overflow:hidden;position:relative}
.cache-val{font-size:10px;color:var(--text);width:30px}
.saved-wrap{display:inline-flex;align-items:center;gap:4px;font-size:11px}
.cache-wrap{display:inline-flex;align-items:center;gap:5px}
.cache-bar{width:52px;height:9px;background:var(--panel2);border:1px solid var(--border2);border-radius:5px;overflow:hidden;position:relative}
.cache-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#0d9488,#2dd4bf,#5eead4);box-shadow:0 0 6px rgba(45,212,191,.5);transition:width .5s ease;position:relative}
.cache-fill::after{content:'';position:absolute;top:0;right:2px;width:3px;height:100%;background:rgba(255,255,255,.55);border-radius:2px;animation:cacheShine 1.2s ease-in-out infinite}
@keyframes cacheShine{0%,100%{opacity:.3}50%{opacity:1}}
.cache-fill.low{background:linear-gradient(90deg,#7c2d12,#fb923c);box-shadow:0 0 6px rgba(251,146,60,.4)}

.focused{border:1px solid var(--accent) !important;box-shadow:0 0 0 1px var(--accent)}
.fail-blink{animation:failBlink 1s ease 3}
@keyframes failBlink{0%,100%{background:rgba(248,113,113,.15)}50%{background:rgba(248,113,113,.4)}}
.empty-state{padding:40px 20px;text-align:center;color:var(--dimmer);font-size:13px}
.empty-state .big{font-size:30px;margin-bottom:10px}
.anchor-hl{background:rgba(251,191,36,.15);border-left:2px solid var(--yellow)}
.review-fix{display:flex;align-items:center;gap:6px;cursor:pointer}
.review-fix .cb{width:12px;height:12px;border:1px solid var(--border2);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--green)}
.review-fix.done .cb{background:rgba(74,222,128,.2);border-color:var(--green)}
.review-fix.done{color:var(--dimmer);text-decoration:line-through}
.side-progress .mini-fill.done-anim{animation:donePop .4s ease}
@keyframes donePop{0%{transform:scaleY(1)}50%{transform:scaleY(1.6)}100%{transform:scaleY(1)}}






















.kbd-list{font-size:11px;color:var(--dim);line-height:2}
.kbd-list .kr{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(46,58,82,.3);padding:2px 4px}
.kbd-list .kk{color:var(--accent)}


/* ============ v21: 左栏信息中枢 + 视觉统一 ============ */
.side{width:300px}
.side-sec{border-bottom:1px solid var(--border)}
.side-sec .sec-head{padding:8px 14px;font-size:11px;color:var(--accent);letter-spacing:2px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.side-sec .sec-head:hover{background:rgba(125,211,252,.04)}
.side-sec .sec-body{max-height:220px;padding:6px 12px 10px;overflow:auto;opacity:1;transition:max-height .28s cubic-bezier(.2,.7,.3,1),padding .28s cubic-bezier(.2,.7,.3,1),opacity .18s ease}
.side-sec .sec-body.collapsed{display:block;max-height:0!important;padding-top:0;padding-bottom:0;overflow:hidden;opacity:0;pointer-events:none}
.sec-arrow{font-size:9px;color:var(--dim);transition:transform .2s}
.side-sec.collapsed-sec .sec-arrow{transform:rotate(-90deg)}
.side-sec.collapsed-sec{border-bottom-color:rgba(46,58,82,.5)}
.pending-zone{position:relative;border-top:1px solid rgba(251,191,36,.25);background:rgba(251,191,36,.05)}
.pending-zone .pz-head{padding:6px 14px;font-size:11px;color:var(--yellow);display:flex;justify-content:space-between;cursor:pointer}
.pz-body{max-height:0;overflow:hidden;opacity:0;transition:max-height .3s cubic-bezier(.2,.7,.3,1),opacity .18s ease}
.pz-body.open{max-height:480px;opacity:1}
.pending-card{border:1px solid rgba(251,191,36,.3);border-radius:8px;background:var(--panel);padding:10px;margin:0 10px 10px}
.pending-card .pc-ctx{font-size:11px;color:var(--dim);margin:4px 0 8px;line-height:1.6}
.pc-cands{display:flex;flex-direction:column;gap:5px}
.pc-cand{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border:1px solid var(--border2);border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s}
.pc-cand:hover{border-color:var(--accent);background:rgba(125,211,252,.06);transform:translateX(2px)}
.pc-cand .cand-zh{color:var(--text)}
.pc-cand .cand-meta{color:var(--dim);font-size:10px}
.pc-cand .cand-ev{font-size:10px;color:var(--dimmer);margin-top:2px}
.pc-skip{align-self:flex-end;font-size:11px;color:var(--dim);cursor:pointer;padding:4px 8px;border-radius:4px}
.pc-skip:hover{color:var(--yellow)}
.term-item{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:12px;border-radius:5px;cursor:pointer}
.term-item:hover{background:rgba(125,211,252,.05)}
.term-item .t-ja{color:var(--text)}
.term-item .t-type{font-size:10px;color:var(--dimmer);margin-left:6px}
.term-item .t-zh{font-size:12px}
.term-item.ok .t-zh{color:var(--green)}
.term-item.warn .t-zh{color:var(--yellow)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;font-size:11px;color:var(--dim)}
.stat-row .s-name{letter-spacing:1px}
.stat-row .s-val{display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.6)}
.dot.run{background:var(--yellow);box-shadow:0 0 6px rgba(251,191,36,.6);animation:pulse 1s infinite}
.dot.idle{background:var(--border2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chip{border-radius:6px;padding:3px 10px;font-size:11px;transition:all .15s;cursor:pointer;border:1px solid var(--border2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.hot{border-color:var(--accent);color:var(--accent);background:rgba(125,211,252,.08)}
.chip.ok{border-color:rgba(74,222,128,.4);color:var(--green)}
.chip.warn{border-color:rgba(251,191,36,.4);color:var(--yellow);animation:borderFlow 1.5s linear infinite}
.chip.warn:hover{color:var(--yellow);border-color:var(--yellow)}

/* v22: 启动中心分区 */
.wc-card{border:1px solid var(--border2);border-radius:10px;background:var(--panel);overflow:hidden;margin-top:12px;transition:border-color .2s}
.wc-card:hover{border-color:rgba(125,211,252,.4)}
.wc-head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);font-size:11px;color:var(--accent);letter-spacing:1px;cursor:pointer}
/* 线框图标：描边继承文字色、宽度与界面里的发丝线同级，字号变了也不会跟着变形 */
.ui-icon{flex:0 0 auto;width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
/* 带图标的 chip：图标与文字之间只留一个小间距，图标不参与换行 */
.icon-chip{display:inline-flex;align-items:center;gap:6px}
.wc-head>span:first-child,.quad-head>span{display:inline-flex;align-items:center;gap:7px;letter-spacing:inherit}
.wc-head:hover{background:rgba(125,211,252,.04)}
.wc-body{padding:12px 14px;font-size:12px}
.wc-body.collapsed{display:none}
.wc-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px}
.wc-k{color:var(--dim)}
.wc-v{color:var(--text)}
.wc-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border:1px solid var(--border2);border-radius:7px;font-size:12px;cursor:pointer;transition:all .15s}
.wc-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(125,211,252,.06)}
.wc-btn.primary{border-color:var(--accent);color:var(--accent);background:rgba(125,211,252,.08)}
.wc-btn.primary:hover{background:rgba(125,211,252,.15)}
.wc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wc-kv{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border2);border-radius:7px;font-size:12px}
.wc-kv:hover{border-color:var(--accent)}
.wc-kv .k{color:var(--dim);font-size:11px}
.wc-kv .v{color:var(--text);margin-left:auto;cursor:pointer}
.wc-nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)}

.quad{border:1px solid var(--border);border-radius:8px;background:var(--panel2);overflow:hidden}
.quad-head{padding:6px 10px;font-size:10px;color:var(--accent);letter-spacing:2px;border-bottom:1px solid var(--border);background:rgba(125,211,252,.04);user-select:none;display:flex;align-items:center}
.quad-head .quad-arrow{font-size:9px;transition:transform .18s;color:var(--dimmer)}
.quad.collapsed .quad-head .quad-arrow{transform:rotate(-90deg)}
.quad.collapsed .quad-body{display:none}
.quad-body{padding:8px 10px}
.quad .wc-kv{padding:4px 6px;font-size:11px;border:1px solid transparent}
.quad .wc-kv:hover{border-color:var(--border2);border-radius:5px;background:rgba(125,211,252,.03)}
.quad .wc-kv .v{font-size:11px}

/* v25: 聚焦半透明边框（用户聚焦区域提示） */
.wc-card:focus-within,.wc-card:hover{border-color:rgba(125,211,252,.35);box-shadow:0 0 0 3px rgba(125,211,252,.06)}
.item.sel{border-left:3px solid rgba(125,211,252,.6);background:linear-gradient(90deg,rgba(125,211,252,.1),transparent)}
.item.glow{border-left:3px solid rgba(251,191,36,.6)}
.bl-zh:focus{outline:1px solid rgba(125,211,252,.4);outline-offset:2px;border-radius:4px;background:rgba(125,211,252,.04)}
.chip:focus-visible,.wc-btn:focus-visible{outline:1px solid rgba(125,211,252,.5);outline-offset:2px}
.pending-zone{border:1px solid rgba(251,191,36,.18);border-radius:0 0 8px 8px;margin:0 6px 6px;box-shadow:0 2px 12px rgba(251,191,36,.06)}

/* v26: 聚焦边框加强 + 切换动画 */
.wc-card:focus-within,.wc-card:hover{border-color:rgba(125,211,252,.65);box-shadow:0 0 0 3px rgba(125,211,252,.12),0 4px 24px rgba(125,211,252,.08)}
.item.sel{border-left:3px solid rgba(125,211,252,.9);background:linear-gradient(90deg,rgba(125,211,252,.16),transparent)}
.item.glow{border-left:3px solid rgba(251,191,36,.9)}
.bl-zh:focus{outline:2px solid rgba(125,211,252,.55);outline-offset:2px;border-radius:4px;background:rgba(125,211,252,.06)}
.chip:focus-visible,.wc-btn:focus-visible{outline:2px solid rgba(125,211,252,.7);outline-offset:2px}
.pending-zone{border:1px solid rgba(251,191,36,.3);border-radius:0 0 8px 8px;margin:0 6px 6px;box-shadow:0 2px 12px rgba(251,191,36,.1)}
.quad{border:1px solid var(--border);transition:border-color .2s,box-shadow .2s}
.quad:hover{border-color:rgba(125,211,252,.45);box-shadow:0 0 0 2px rgba(125,211,252,.07)}

/* 切换动画 */
.wc-kv .v,.wc-btn,.chip{transition:color .15s,border-color .15s,background .15s,transform .15s}
.wc-kv .v:hover{color:var(--accent)}
.v-anim{animation:vSlideL .22s cubic-bezier(.2,.7,.3,1)}
.v-anim.r{animation:vSlideR .22s cubic-bezier(.2,.7,.3,1)}
@keyframes vSlideL{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:translateX(0)}}
@keyframes vSlideR{0%{opacity:0;transform:translateX(10px)}100%{opacity:1;transform:translateX(0)}}
body{transition:background-color .3s ease,color .3s ease}
.quad-body{transition:opacity .2s}
.quad-body.fade-in{animation:quadFade .3s ease}
@keyframes quadFade{0%{opacity:.4}100%{opacity:1}}

/* v28: 模态覆盖展开 + 完成缩回 */
.modal-pop{animation:modalIn .28s cubic-bezier(.2,.9,.3,1.15);transform-origin:center}
@keyframes modalIn{0%{opacity:0;transform:scale(.82) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.modal-out{animation:modalOut .18s ease forwards}
@keyframes modalOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85) translateY(6px)}}
.modal-back{animation:backFade .28s ease}
@keyframes backFade{0%{opacity:0}100%{opacity:1}}

/* v30: 隐形边框 select（hover 才显形，macOS 风格） */
select.ghost{background:transparent;border:none;color:var(--accent);cursor:pointer;font-size:11px;padding:3px 6px;outline:none;border-radius:5px;transition:background .15s;-webkit-appearance:none;appearance:none}
select.ghost:hover{background:rgba(125,211,252,.08)}
select.ghost:focus-visible{background:rgba(125,211,252,.1)}
select.ghost option{background:var(--panel);color:var(--text)}
select.ghost option:hover{background:var(--panel2)}

/* v31: 自定义下拉（暗色圆角面板，统一风格） */
.cs{position:relative;display:inline-block}
.cs-trig{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;cursor:pointer;color:var(--accent);font-size:11px;transition:background .15s;user-select:none}
.cs-trig:hover{background:rgba(125,211,252,.08)}
.cs-trig .arr{font-size:9px;color:var(--dim);transition:transform .2s;transform:rotate(90deg)}
.cs.open .cs-trig .arr{transform:rotate(0deg)}
.cs.open .cs-trig{background:rgba(125,211,252,.12)}
.cs-panel{position:fixed;min-width:190px;max-height:240px;overflow:auto;background:var(--panel);border:1px solid rgba(125,211,252,.35);border-radius:8px;padding:4px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.55);animation:csIn .16s ease}
@keyframes csIn{0%{opacity:0;transform:translateY(-4px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}
.cs-item{padding:6px 10px;font-size:11px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--text);transition:background .12s}
.cs-item:hover{background:rgba(125,211,252,.1)}
.cs-item.sel{color:var(--accent)}
.cs-item.sel::after{content:'✓';color:var(--accent);font-size:10px}
.cs-item .sub{font-size:9px;color:var(--dimmer)}
.cs-item.new{border-top:1px dashed var(--border)}

/* 折叠编辑区（翻译指南/审校规则共用）。历史教训：这里曾是 v32 单行 API-Key 框的 60px，
   v44 两个多行面板复用后保存按钮/添加行全被裁在裁切线以下且不可滚动——上限必须按最高的面板给，
   超出部分允许滚动 */
.api-area{max-height:0;opacity:0;overflow:hidden;transition:max-height .25s ease,opacity .2s ease}
.api-area.open{max-height:420px;opacity:1;overflow:auto}

/* v34: Base URL 编辑过渡 */
.base-cell{display:inline-flex;align-items:center;min-height:22px;gap:6px}

/* 逐段: 段落 hover 高亮 */
.bl-row:hover{background:rgba(125,211,252,.03);border-radius:6px}

/* v39: 快捷键+按钮组合 */
.act{display:inline-flex;align-items:center;gap:4px}
.act kbd{font-size:9px;padding:1px 4px;border-radius:3px;color:var(--dim);background:var(--panel2);border:1px solid var(--border)}
.act .chip{padding:2px 8px;font-size:10px}


/* v42: 主要功能按钮特别标注 */
.chip.main-act{background:linear-gradient(135deg,rgba(125,211,252,.22),rgba(74,222,128,.15));border-color:rgba(125,211,252,.6);color:var(--accent);font-weight:600}
.chip.main-act:hover{box-shadow:0 0 8px rgba(125,211,252,.35)}


/* v74: 单栏收敛——书名=切换入口，路径内嵌，整体面板风格 */
.book-bar{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;padding:7px 10px;border-bottom:1px solid var(--border);background:rgba(125,211,252,.02)}
.book-bar .cs-trig{width:100%;justify-content:space-between;align-items:center;padding:6px 12px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:12px;font-family:var(--mono);transition:border-color .15s,background .15s}
.book-bar .cs-trig:hover{border-color:rgba(125,211,252,.4);background:rgba(125,211,252,.06)}
.book-bar .cs-trig .arr{color:var(--accent);font-size:9px;flex-shrink:0}
.book-bar .cs.open .cs-trig{border-color:rgba(125,211,252,.5);background:rgba(125,211,252,.1)}
/* v78: 书名冷色双调；长标题最多两行 */
.trig-title{
  display:-webkit-box;flex:1;min-width:0;max-width:100%;overflow:hidden;
  -webkit-box-orient:vertical;-webkit-line-clamp:2;
  font-size:12px;font-weight:650;font-style:normal;line-height:1.35;letter-spacing:0;
  white-space:normal;overflow-wrap:anywhere;
  background:linear-gradient(90deg,#7dd3fc 0%,#a5b4fc 58%,#c4b5fd 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  pointer-events:none
}
/* v53: 书 Tab 栏 + 卷分组 */
.book-tabs{display:block;width:100%;padding:0;border-bottom:0;overflow:visible}
.book-tabs::-webkit-scrollbar{display:none}
.book-tabs:hover{cursor:default}
.book-tab{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:6px;cursor:pointer;background:var(--panel2);border:1px solid var(--border);color:var(--dim);white-space:nowrap;transition:all .15s}
.book-tab:hover{border-color:rgba(125,211,252,.4)}
.book-tab.hot{background:rgba(125,211,252,.12);border-color:rgba(125,211,252,.55);color:var(--accent);font-weight:600}
.book-tab.add{background:transparent;border-style:dashed;color:var(--dimmer)}
.book-meta{font-size:10px;color:var(--dimmer);padding:6px 12px 2px;border-bottom:1px dashed var(--border)}
.vol-head{display:flex;align-items:center;gap:6px;padding:5px 12px;font-size:11px;cursor:pointer;color:var(--dim);border-bottom:1px solid rgba(46,58,82,.3);background:rgba(125,211,252,.03)}
.vol-head:hover{color:var(--accent)}
.vol-title{flex:1;font-weight:600;transition:color .18s ease}
.vol-current{font-size:9px;opacity:0;transition:opacity .18s ease}
.vol-head.current-vol .vol-title{color:var(--accent2)}
.vol-head.current-vol .vol-current{opacity:.85}
.vol-head .arrow{font-size:9px;transition:transform .15s;transform:rotate(90deg)}
.vol-head .arrow.closed{transform:rotate(0deg)}
.vol-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;padding:0}
.vol-body.open{grid-template-rows:1fr}
.vol-body>div{overflow:hidden;min-height:0}
/* v64: 卷展开时章节逐条弹出（stagger） */
.vol-body.open .item{animation:volItemIn .22s ease both}
.vol-body.open .item:nth-child(1){animation-delay:.02s}
.vol-body.open .item:nth-child(2){animation-delay:.05s}
.vol-body.open .item:nth-child(3){animation-delay:.08s}
.vol-body.open .item:nth-child(4){animation-delay:.11s}
.vol-body.open .item:nth-child(5){animation-delay:.14s}
.vol-body.open .item:nth-child(6){animation-delay:.17s}
.vol-body.open .item:nth-child(7){animation-delay:.2s}
.vol-body.open .item:nth-child(8){animation-delay:.23s}
@keyframes volItemIn{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}

/* v54: 当前章精致标记 + 卷徽标 */
.item.cur{background:linear-gradient(90deg,rgba(125,211,252,.2),rgba(125,211,252,.04));border-left:3px solid var(--accent);box-shadow:inset 0 0 12px rgba(125,211,252,.06)}
.cur-badge{font-size:9px;padding:1px 6px;border-radius:8px;background:rgba(125,211,252,.18);border:1px solid rgba(125,211,252,.5);color:var(--accent);font-weight:600;letter-spacing:.5px}
.vol-chip{font-size:9px;padding:0 4px;border-radius:4px;background:rgba(148,163,184,.12);color:var(--dim);margin-left:4px}

/* v55: 卷名/章名 ✎ 编辑按钮（hover 显示） */
.vol-edit,.ch-edit{font-size:10px;color:var(--dimmer);opacity:0;transition:opacity .15s;cursor:pointer;padding:0 2px}
.vol-head:hover .vol-edit,.item:hover .ch-edit{opacity:1}
.vol-edit:hover,.ch-edit:hover{color:var(--accent)}
.vol-new{font-size:13px;line-height:1;color:var(--dimmer);opacity:0;transition:opacity .15s,color .15s;cursor:pointer;padding:0 3px}
.vol-head:hover .vol-new{opacity:1}
.vol-new:hover{color:var(--green)}
.ch-del,.vol-del{font-size:10px;line-height:1;color:var(--dimmer);opacity:0;transition:opacity .15s,color .15s;cursor:pointer;padding:2px 4px;border-radius:4px;font-family:var(--ui)}
.vol-head:hover .vol-del,.item:hover .ch-del{opacity:1}
.ch-del:hover,.vol-del:hover{color:var(--red);background:rgba(255,85,85,.12)}
.ch-del.confirm,.vol-del.confirm{color:var(--red);border:1px solid var(--red);border-radius:4px;font-size:10px;padding:1px 4px;opacity:1;background:rgba(255,85,85,.12)}

/* v56: 变体探索——编辑方式 + 浮动切换条 */
.ed-sim{flex:1;min-width:0;background:transparent;border:none;border-bottom:1px dashed rgba(125,211,252,.6);padding:0 2px;font-size:inherit;color:inherit;outline:none;border-radius:0;font-family:inherit}
.ed-sim:hover{border-bottom-color:rgba(125,211,252,.9)}
.float-edit{position:absolute;left:0;top:calc(100% + 4px);z-index:50;display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid rgba(125,211,252,.4);border-radius:8px;padding:6px 8px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.float-edit input{width:150px;background:var(--panel2);border:1px solid var(--border2);border-radius:5px;padding:3px 6px;font-size:12px;color:var(--text);outline:none}

/* v58: 编辑态退出（已改为 Enter/Escape/blur，无 ✓/✕ 按钮） */
.ed-sim[data-editing]{border-bottom-color:rgba(80,250,123,.7)}

/* v59: 书栏（下拉舒展 + 加号右端固定） */
/* v61: 箭头统一——收起朝右(▶) 展开朝下 */
.book-add{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px dashed var(--border);color:var(--dim);font-size:15px;cursor:pointer;transition:all .15s}
.book-add:hover{border-color:rgba(125,211,252,.5);color:var(--accent);background:rgba(125,211,252,.08)}

/* v65: 切换书列表丝滑弹出 */
@keyframes listIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}

/* v66: kitty 式章节光标（滑动高亮） */
.ch-cursor{position:absolute;left:3px;right:3px;background:linear-gradient(90deg,rgba(125,211,252,.20),rgba(125,211,252,.02));border-left:3px solid var(--accent);border-radius:6px;transition:top .28s cubic-bezier(.2,.7,.3,1),height .28s cubic-bezier(.2,.7,.3,1),opacity .16s ease;pointer-events:none;z-index:0}
#chapter-list .item{position:relative;z-index:1}
.ch-cursor.placing{transition:none}

/* v66: 删除撤回 toast */
#undo-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);z-index:998;background:#0f1522;border:1px solid rgba(125,211,252,.4);border-radius:20px;padding:7px 16px;font-size:11px;color:var(--text);opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 6px 24px rgba(0,0,0,.6);display:flex;gap:10px;align-items:center}
#undo-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#undo-toast .undo-btn{color:var(--accent);cursor:pointer;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(125,211,252,.1)}
#undo-toast .undo-btn:hover{background:rgba(125,211,252,.2)}

/* v69: 编辑态统一额外空间 */
.vol-head.editing,.item.editing,.term-item.editing{padding-top:8px;padding-bottom:8px}
.item.editing{padding-left:14px}

/* v70: 播报行内撤回链接 */
.ev-undo{display:inline-flex;align-items:center;gap:3px;color:var(--accent);cursor:pointer;font-weight:600;padding:1px 7px;border-radius:6px;background:rgba(125,211,252,.1);border:1px solid rgba(125,211,252,.28);margin-left:4px;font-size:10px;line-height:1.4;vertical-align:1px}
.ev-undo:hover{background:rgba(125,211,252,.24);border-color:var(--accent);color:var(--text)}
.ev.err .ev-undo{color:var(--green);background:rgba(80,250,123,.08);border-color:rgba(80,250,123,.3)}
.ev.err .ev-undo:hover{background:rgba(80,250,123,.2);border-color:var(--green);color:var(--text)}

/* v71: 事件流操作图标 */
.ev-ico{cursor:pointer;font-size:11px;opacity:.6;transition:opacity .15s;line-height:1}
.ev-ico:hover{opacity:1;color:var(--accent)}
.event-dock{flex:0 0 auto;min-height:0;max-height:110px;border-top:1px solid var(--border);background:rgba(10,15,24,.76);opacity:1;overflow:hidden;transition:max-height .25s cubic-bezier(.2,.7,.3,1),opacity .18s ease,border-color .18s ease}
.event-dock.closed{max-height:0;border-top-color:transparent;opacity:0;pointer-events:none}
.event-dock-head{height:24px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:10px;color:var(--dimmer)}
.event-dock-title{color:var(--accent);letter-spacing:1px}
#ev-list{padding:2px 14px 6px;font-size:11px;display:flex;flex-direction:column;gap:2px;max-height:76px;overflow:auto}
.event-launch{display:inline-flex;align-items:center;gap:5px;padding:2px 6px;border-radius:5px;color:var(--dimmer);cursor:pointer;transition:color .15s,background .15s}
.event-launch.hot{color:var(--accent)}
.event-launch:hover{color:var(--accent);background:rgba(125,211,252,.08)}
.event-count{min-width:12px;text-align:center;color:inherit}
/* 忙碌指示器：长调用期间后端可能一两分钟不发任何事件（语气归属实测单次 118 秒）。
   秒表由前端自己走，不依赖后端——这是"没卡死"唯一可信的证据。 */
.busy-card{position:fixed;right:16px;bottom:46px;z-index:38;display:none;align-items:flex-start;gap:9px;max-width:340px;padding:10px 13px;border:1px solid rgba(125,211,252,.4);border-radius:9px;background:rgba(13,17,23,.94);box-shadow:0 6px 26px rgba(0,0,0,.5);backdrop-filter:blur(3px)}
.busy-card.on{display:flex;animation:busyIn .22s ease-out}
@keyframes busyIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
.busy-spin{flex:none;width:13px;height:13px;margin-top:2px;border:2px solid rgba(125,211,252,.22);border-top-color:var(--accent);border-radius:50%;animation:busySpin .8s linear infinite}
@keyframes busySpin{to{transform:rotate(360deg)}}
.busy-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.busy-line{display:flex;align-items:baseline;gap:7px}
.busy-what{font-size:12px;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.busy-time{flex:none;font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
.busy-sub{font-size:11px;line-height:1.5;color:var(--accent2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.busy-note{font-size:10.5px;line-height:1.5;color:var(--dim)}
/* 思考直播（TR-04）。刻意压暗压小：它是旁证不是主线，用户读的仍是 busy-sub 那一行动作。 */
.busy-think{display:flex;flex-direction:column;gap:2px;margin-top:3px;min-width:0}
.busy-think-head{display:flex;align-items:center;gap:4px;padding:0;border:0;background:none;color:var(--dim);font:inherit;font-size:10.5px;cursor:pointer;text-align:left}
.busy-think-head:hover{color:var(--accent2)}
.busy-think-caret{flex:none;font-size:9px;transition:transform .15s ease}
.busy-think-head[aria-expanded="true"] .busy-think-caret{transform:rotate(90deg)}
/* 打字机那一行：单行、右对齐滚动，新字符从右边推进来。等宽让字符不左右跳。 */
.busy-think-tail{font-size:10.5px;line-height:1.6;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:clip;opacity:.75}
.busy-think-tail:empty{display:none}
/* 展开态：给一个上限，几万字符的思考不该把卡片顶穿屏幕 */
.busy-think-full{max-height:150px;overflow-y:auto;font-size:10.5px;line-height:1.6;color:var(--accent2);white-space:pre-wrap;word-break:break-word;padding:4px 6px;border-left:2px solid rgba(125,211,252,.25);background:rgba(125,211,252,.04);border-radius:0 4px 4px 0}
/* 正文直播。比思考亮一档：思考是旁证，正文是交付物本身。 */
.busy-body{display:flex;flex-direction:column;gap:2px;margin-top:4px;min-width:0}
.busy-body-head{font-size:10.5px;color:var(--dim)}
.busy-body-text{max-height:96px;overflow-y:auto;font-size:11.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;padding:4px 7px;border-left:2px solid var(--accent);background:rgba(125,211,252,.07);border-radius:0 4px 4px 0}
/* 光流：只扫**刚到达**的那一段（.fresh 由渲染层挂在最新一段上，两秒后摘掉）。
   加在静态文本上就只是装饰；加在这里它标记的是真实的产出位置。 */
.busy-body-text .fresh{background-image:linear-gradient(100deg,transparent 20%,rgba(125,211,252,.42) 50%,transparent 80%);background-size:220% 100%;background-repeat:no-repeat;animation:bodySweep 1.5s ease-out}
@keyframes bodySweep{0%{background-position:120% 0}100%{background-position:-120% 0}}
@media (prefers-reduced-motion: reduce){.busy-body-text .fresh{animation:none;background-image:none}}
/* 会话式时间轴。与思考直播同一层视觉重量：它们都是旁证，主线仍是 busy-sub 那一行。 */
.busy-flow{display:flex;flex-direction:column;gap:2px;margin-top:3px;min-width:0}
.busy-flow-head{display:flex;align-items:center;gap:4px;padding:0;border:0;background:none;color:var(--dim);font:inherit;font-size:10.5px;cursor:pointer;text-align:left}
.busy-flow-caret{transition:transform .15s ease}
.busy-flow-head[aria-expanded="true"] .busy-flow-caret{transform:rotate(90deg)}
.busy-flow-list{display:flex;flex-direction:column;gap:0;max-height:190px;overflow-y:auto;margin-top:2px;padding-left:2px}
.bf-step{display:grid;grid-template-columns:38px 9px 1fr;align-items:start;gap:5px;padding:2px 0;font-size:10.5px;line-height:1.5}
.bf-at{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
/* 竖线把各格串成一条流水——没有它就只是一摞行 */
.bf-rail{position:relative;align-self:stretch;justify-self:center;width:1px;background:rgba(125,211,252,.22)}
.bf-step:first-child .bf-rail{background:linear-gradient(to bottom,transparent 0,transparent 5px,rgba(125,211,252,.22) 5px)}
.bf-step:last-child .bf-rail{background:linear-gradient(to bottom,rgba(125,211,252,.22) 0,rgba(125,211,252,.22) 6px,transparent 6px)}
.bf-dot{position:absolute;left:50%;top:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent2)}
.bf-body{min-width:0}
.bf-title{color:var(--text)}
.bf-detail{color:var(--dim);word-break:break-word}
.bf-thinking .bf-dot{background:var(--accent)}
.bf-gap .bf-dot{background:transparent;border:1px solid rgba(125,211,252,.5)}
.bf-warning .bf-dot,.bf-failed .bf-dot{background:#f0a868}
.bf-done .bf-dot{background:#6cc48f}
.bf-running .bf-dot{animation:bfPulse 1.1s ease-in-out infinite}
@keyframes bfPulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.bf-running .bf-dot{animation:none}}
/* 快捷去处：出问题时最想去的三个地方 */
.busy-jump{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.busy-jump-btn{padding:2px 7px;border:1px solid rgba(125,211,252,.34);border-radius:5px;background:rgba(125,211,252,.07);color:var(--accent2);font:inherit;font-size:10.5px;cursor:pointer}
.busy-jump-btn:hover{background:rgba(125,211,252,.16);color:var(--text)}
/* 结束后打字机停下——光标还在闪会让人以为它还在跑 */
.busy-think.running .busy-think-tail::after{content:"▌";color:var(--accent);animation:thinkCaret 1s steps(2) infinite}
@keyframes thinkCaret{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.busy-think.running .busy-think-tail::after{animation:none}}
@media (prefers-reduced-motion: reduce){.busy-spin{animation-duration:2.4s}.busy-card.on{animation:none}}
/* 侧栏进度条：有章节正在跑时流动，静止时不动——动画本身就是状态 */
.gfill.working{background-image:linear-gradient(115deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:14px 14px;animation:progStripe .9s linear infinite}
@keyframes progStripe{to{background-position:14px 0}}

/* v101: typography pass — clear CJK reading and quiet UI chrome */

body{font-family:var(--ui);font-size:13px;line-height:1.55;letter-spacing:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:inherit}
.term-titlebar,.term-body,.footer,.switcher{font-family:var(--ui)}
.continuous-editor,.term-workspace,.review-surface,.term-directory,.author-toolbar,.author-action-panel{font-family:var(--cjk)}
.continuous-editor{font-size:16px}
.ce-source{font-family:var(--jp);font-size:14px;line-height:1.9;font-weight:400}
.ce-translation{font-family:var(--cjk);font-size:18px;line-height:2;font-weight:400}
.term-workspace-head h2,.term-section-head h3,.term-candidate-head strong,.review-item-top strong,.review-kicker{font-family:var(--cjk)}
.term-workspace-head h2{line-height:1.4;font-weight:600}
.term-workspace-head p,.term-candidate-context,.review-item p,.review-suggestion,.review-evidence{font-family:var(--cjk);line-height:1.7}
.side .head,.side-sec .sec-head,.term-workspace-kicker,.term-section-kicker,.event-dock-title,.review-kicker{letter-spacing:0}
.book-meta,.term-progress,.term-workspace-count strong,.term-candidate-head>span,.term-candidate-option>b,.ce-meta,.ce-review-evidence code,.editor-foot-meta,.editor-foot-shortcut,kbd{font-family:var(--mono);font-variant-numeric:tabular-nums}
.term-workspace-count strong{font-weight:600}
.term-candidate-head strong,.term-authority-row strong,.term-ja strong,#terms-body .t-ja{font-family:var(--jp)}
.term-authority-row>b,.term-zh,#terms-body .t-zh{font-family:var(--cjk)}
/* v102: sidebar hierarchy pass — explorer first, status second */
.side{background:var(--panel);border-right-color:var(--border2)}
.book-bar{background:var(--panel);border-bottom-color:var(--border)}
.book-bar .cs-trig{background:var(--panel2);border-color:var(--border2);font-family:var(--cjk)}
.book-bar .cs-trig:hover,.book-bar .cs.open .cs-trig{background:rgba(189,147,249,.1);border-color:var(--accent)}
.book-add{border-color:var(--border2);background:transparent;color:var(--dimmer)}
.book-add:hover,.book-add:focus-visible{background:rgba(189,147,249,.1);border-color:var(--accent);color:var(--accent)}
/* 侧栏拖拽导入：悬停高亮 + 覆盖提示层 */
.side{position:relative}
.side.drag-over::after{content:'';position:absolute;inset:0;z-index:30;pointer-events:none;background:rgba(189,147,249,.10);border:2px dashed var(--accent)}
.side-drop-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:31;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:8px;padding:22px 30px;border:1px solid var(--accent);border-radius:12px;background:var(--panel);box-shadow:0 12px 36px rgba(0,0,0,.5)}
.side-drop-hint .drop-ico{font-size:26px;color:var(--accent)}
.side-drop-hint .drop-txt{font-size:12px;color:var(--text)}
.side-drop-hint .drop-sub{font-size:10px;color:var(--dimmer)}
.side.drag-over .side-drop-hint{display:flex}
.side-drop-toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:32;pointer-events:none;padding:7px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--accent);color:var(--text);font-size:11px;opacity:0;transition:opacity .2s}
.side-drop-toast.show{opacity:1}

#chapter-list .vol-head.current-vol .vol-title,#chapter-list .vol-head.current-vol .vol-current{color:var(--accent)}
#chapter-list .vol-head.current-vol:hover{background:rgba(189,147,249,.14)}
#chapter-list .vol-body{background:var(--panel)}
#chapter-list .item{min-height:36px;padding:8px 14px 8px 18px;color:var(--text);font-family:var(--cjk)}

#chapter-list .item .drag-grip{display:inline-flex;align-items:center;color:var(--dimmer);font-size:11px;margin-right:2px;opacity:.45;cursor:grab;transition:opacity .15s,color .15s}
#chapter-list .item:hover .drag-grip{opacity:1;color:var(--accent)}
.drag-ghost{position:fixed;z-index:999;display:none;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--accent);color:var(--text);font-size:12px;font-family:var(--cjk);box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap}
.drag-ghost.show{display:inline-flex}
.drag-line{position:fixed;z-index:998;display:none;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 6px rgba(189,147,249,.7);pointer-events:none}
.drag-line.show{display:block}
#chapter-list .vol-head.drop-target-vol,#chapter-list .vol-body.drop-target-vol{outline:1px dashed var(--accent);outline-offset:-2px;border-radius:6px;background:rgba(189,147,249,.08)}
#chapter-list .item:hover{background:rgba(139,233,253,.055)}
#chapter-list .item .st{font-family:var(--ui);font-variant-numeric:tabular-nums}
#chapter-list .ch-cursor{background:rgba(189,147,249,.1);border-left-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(189,147,249,.12)}
.pending-zone{border-left:3px solid var(--accent2);background:rgba(255,121,198,.06);border-color:rgba(255,121,198,.46);border-left-color:var(--accent2)}
.pending-zone .pz-head{font-family:var(--cjk)}

/* ---- 方案 B：工作台三栏 header ---- */
.workbench-header{align-items:center;gap:28px;min-height:66px;padding:12px 24px}
.workbench-header .b-id{display:flex;flex-direction:column;gap:2px;min-width:200px}
.workbench-header .b-kicker{color:var(--dimmer);font-family:var(--ui);font-size:10px;line-height:1.4}
.workbench-header h1{margin:0;color:var(--text);font-family:var(--cjk);font-size:17px;font-weight:600;line-height:1.35}
.workbench-header .b-info{flex:1;display:flex;align-items:center;gap:20px;min-width:0}
.info-cell{
  flex:1;max-width:260px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;
  height:52px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#1f212d;
  cursor:pointer;
  opacity:0;transform:translateY(3px);
  transition:opacity .28s ease, transform .28s ease, border-color .15s, background .15s;
}
.info-cell.shown{opacity:1;transform:none}
.info-cell:hover{border-color:var(--border2);background:#232532}
.info-cell.hiding{opacity:0;pointer-events:none}
.info-cell.multi{flex:0 0 200px;max-width:200px}
.info-cell .ic-top{display:flex;justify-content:space-between;gap:8px;font-family:var(--ui);font-size:10px}
.info-cell .ic-top .ic-label{color:var(--dimmer)}
.info-cell .ic-top .ic-val{color:var(--text)}
.info-cell .ic-top .ic-val b{color:var(--yellow);font-weight:600}
.info-cell .ic-top .ic-val.accent{color:var(--accent)}
.info-cell .ic-detail{color:#6272a4;font-family:var(--ui);font-size:9px}
.info-cell .ic-track{height:4px;border-radius:2px;background:#343746;overflow:hidden}
.info-cell .ic-track i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.workbench-header .b-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.workbench-header .bm-save{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-family:var(--ui);font-size:10px}
.workbench-header .bm-save .status-dot{background:var(--green);box-shadow:0 0 0 3px rgba(80,250,123,.10);animation:lightee-pulse 2.4s ease-in-out infinite}
@keyframes lightee-pulse{0%,100%{opacity:1}50%{opacity:.45}}
.workbench-header .bm-src{display:inline-flex;align-items:center;gap:8px;color:var(--dimmer);font-family:var(--ui);font-size:10px}
.workbench-header .toggle-src{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--border2);border-radius:3px;
  background:transparent;color:var(--dim);font-family:var(--ui);font-size:9px;cursor:pointer;transition:all .12s;
}
.workbench-header .toggle-src:hover{border-color:var(--accent);color:var(--text)}
.workbench-header .toggle-src .dot{width:7px;height:7px;border-radius:2px;background:var(--accent);opacity:.9}
.chapter-identity{min-width:0}
.chapter-kicker{display:block;color:var(--dimmer);font-family:var(--ui);font-size:10px;line-height:1.4}
.chapter-identity h1{margin-top:3px;color:var(--text);font-family:var(--cjk);font-size:19px;font-weight:600;line-height:1.35}
.chapter-phase{display:flex;align-items:flex-end;gap:8px;flex:0 0 auto;font-family:var(--ui)}
.chapter-phase span{color:var(--dimmer);font-size:10px}
.chapter-phase strong{color:var(--accent2);font-size:11px;font-weight:600}
.workflow-tabs{min-height:36px!important;align-items:stretch;padding:0 20px;background:var(--panel);border-bottom-color:var(--border2);gap:4px}
.workflow-tab{
  position:relative;display:flex!important;align-items:center;justify-content:center;gap:6px;
  min-width:0;height:36px;padding:0 16px!important;border:0;background:transparent;
  color:var(--dimmer);font-family:var(--cjk);box-shadow:none!important;cursor:pointer;
  transition:color .18s ease, background .18s ease;
}
.workflow-tab::after{ /* 激活指示条：scaleX 平滑展开 */
  content:'';position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:1px;
  background:var(--accent);opacity:0;transform:scaleX(0);transform-origin:center;
  transition:opacity .2s ease, transform .24s cubic-bezier(.22,.8,.36,1);
}
.workflow-tab:hover{color:var(--text)}
.workflow-tab.on{color:var(--text);background:transparent}
.workflow-tab.on::after{opacity:1;transform:scaleX(1)}
.workflow-tab-main{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;line-height:1;white-space:nowrap}
.workflow-tab-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:15px;height:15px;padding:0 4px;border-radius:4px;
  font-family:var(--mono);font-size:9px;font-weight:600;line-height:1;
}
/* 术语是三态：未提取 / 待确认 N / 已确认。压成两态时「从未提取」会被显示成 ✓。
   绿色那条从前写成 `:not(.warn)` 且排在最后，于是 idle / busy 的灰与蓝都被它盖掉——
   刚导入、一条术语都没有的工作区，徽标照样是绿的。改为只有 .ok 才绿。 */
.workflow-tab-badge{background:rgba(150,150,150,.12);color:var(--dimmer)}
.workflow-tab-badge.warn{background:rgba(241,248,140,.16);color:var(--yellow)}
.workflow-tab-badge.idle{background:rgba(150,150,150,.12);color:var(--dimmer)}
.workflow-tab-badge.busy{background:rgba(125,211,252,.16);color:var(--accent)}
.workflow-tab-badge.ok{background:rgba(80,250,123,.14);color:var(--green)}
.term-mini-empty{padding:10px 8px;color:var(--dimmer);font-size:10px;line-height:1.8}
.footer{grid-template-columns:minmax(0,1fr) auto;min-height:42px;gap:0;padding:6px 14px;background:var(--panel);border-top-color:var(--border2)}
.footer-state{gap:10px;white-space:nowrap}
.footer-state .sys-agent{gap:5px;font-size:10px}
.footer-state .sys-agent strong{font-weight:500}
.footer-metrics{gap:8px}
.footer-metric{display:inline-flex;align-items:baseline;gap:3px;color:var(--dim);font-family:var(--mono);font-size:10px;white-space:nowrap}
.footer-metric small{color:var(--dimmer);font-family:var(--ui);font-size:9px}
.footer-token{color:var(--text)}
.footer-term-summary{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-family:var(--ui);font-size:10px;white-space:nowrap}
.footer-term-summary>i{color:var(--border2);font-style:normal}
.footer-term-summary> b{font-family:var(--mono);font-size:10px;font-weight:600}
.footer-term-link{min-height:24px;margin-left:1px;padding:3px 7px;font-family:var(--ui);font-size:10px}
.footer-term-link b{font-family:var(--mono);font-size:10px}
.footer-save{display:inline-flex;align-items:center;gap:5px;font-size:10px;white-space:nowrap}
.footer-save .status-dot{width:5px;height:5px;box-shadow:0 0 0 2px rgba(80,250,123,.1)}
.footer-actions{gap:6px;margin-left:14px;padding-left:14px;border-left-color:var(--border)}
.footer-actions .act{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.footer-actions .chip{display:inline-flex;align-items:center;min-height:26px;padding:3px 8px;font-family:var(--ui);font-size:10px;order:1}
.footer-actions kbd{order:2;padding:0 2px;border:0;background:transparent;color:var(--dimmer);font-size:9px}
.footer-actions .act:hover kbd{color:var(--accent)}
/* v105: leave a hard gap before commands so save status stays readable */
.footer-actions{gap:4px;margin-left:8px;padding-left:8px}
.footer-actions .chip{padding-left:6px;padding-right:6px}
.footer-actions kbd{padding-left:1px;padding-right:1px}
.ce-review-process.manual-complete{border-color:var(--blue);color:var(--blue)}
.ce-review-process.manual-complete:hover{background:rgba(139,233,253,.1)}
/* v104: review choice controls and protected save status */
.ce-block.review-manual-editing .ce-translation{background:rgba(139,233,253,.08);box-shadow:inset 0 -2px 0 var(--blue)}
.ce-block.review-manual-editing .ce-review{border-left-color:var(--blue)}
.ce-block.review-manual-editing .ce-review-marker{background:var(--blue);color:#282a36}
.review-action-button.manual{border-color:var(--blue);color:var(--blue)}
.review-action-button.manual:hover{background:rgba(139,233,253,.1);border-color:var(--blue);color:var(--blue)}
.footer{grid-template-columns:minmax(205px,auto) minmax(0,1fr) max-content}
.footer-state{min-width:205px}
.footer-metrics{min-width:0;overflow:visible;white-space:nowrap}
.footer-metrics>*{flex:0 0 auto}
.footer-save{flex:0 0 auto}
.footer-actions{min-width:max-content;margin-left:10px;padding-left:10px}
/* AI 模型设置区（扁平化：无卡片、无分隔线、少滚动） */
.ai-body{display:flex;flex-direction:column;gap:16px;padding:14px 16px}
/* 服务商 · 模型。设置面默认是快捷设置；服务商与模型的完整管理在按需展开的详细面板里。 */

/* —— 快捷设置 —— */
#ai-quick{display:flex;flex-direction:column;gap:12px}
.ai-quick-foot{display:flex;justify-content:flex-end;margin-top:2px;padding-top:9px;border-top:1px solid var(--border2)}
.ai-hint{font-size:10px;color:var(--dimmer);line-height:1.7}

/* —— 详细面板：左列服务商 / 右侧详情 —— */
.ai-md{display:grid;grid-template-columns:184px 1fr;gap:12px;align-items:start}
.ai-md-list{display:flex;flex-direction:column;gap:2px;padding:5px;border:1px solid var(--border2);border-radius:8px;background:var(--panel);overflow-y:auto;max-height:392px}
.ai-md-item{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:6px;font-size:11px;color:var(--dim);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.ai-md-item:hover{background:var(--panel2);color:var(--text)}
.ai-md-item.on{background:rgba(125,211,252,.1);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.ai-md-item .nm{overflow:hidden;text-overflow:ellipsis}
.ai-md-item .kd{margin-left:auto;flex:0 0 auto;font-size:9px;color:var(--dimmer)}
.ai-md-item .kd.ok{color:var(--green)}
.ai-md-item .cur{flex:0 0 auto;color:var(--accent);font-size:9px}
.ai-md-item.add{margin-top:5px;padding-top:9px;border-top:1px solid var(--border2);border-radius:0;color:var(--accent)}
.ai-md-item.add:hover{background:transparent;color:var(--accent)}
.ai-md-detail{display:flex;flex-direction:column;gap:11px;min-width:0}
.ai-md-empty{padding:26px 12px;text-align:center;font-size:11px;color:var(--dimmer);line-height:2}

/* 详情内的分节：把「基本信息 / 密钥 / 模型」分开，避免一整片输入框糊成一块 */
.ai-sect{display:flex;flex-direction:column;gap:8px}
.ai-sect-head{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:1.4px;color:var(--dimmer);text-transform:uppercase}
.ai-sect-head::after{content:"";flex:1;height:1px;background:var(--border2)}
.ai-sect-head .acts{display:flex;gap:6px;text-transform:none;letter-spacing:0}

/* —— 模型表格 —— */
.ai-models{border:1px solid var(--border2);border-radius:8px;overflow:hidden}
/* 模型行改成两行卡片，而不是六列表格。
   六列挤在一个窄面板里是在赌宽度：容器一窄，行就溢出，而 .ai-models 为圆角裁剪设了
   overflow:hidden，最右边的「×」直接被切掉。两行布局 + flex-wrap 在任何宽度下都成立，
   动作永远在第一行右端，规格不够宽就换行。 */
.ai-model-row{display:flex;flex-direction:column;gap:7px;padding:9px 10px}
.ai-model-row+.ai-model-row{border-top:1px solid var(--border2)}
.ai-model-row:hover{background:var(--panel)}
.mr-main{display:flex;align-items:center;gap:8px;min-width:0}
.mr-main input{flex:1 1 auto;min-width:0}
.mr-specs{display:flex;flex-wrap:wrap;gap:7px 14px;padding-left:30px}
.mr-specs label{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--dimmer);white-space:nowrap}
.mr-specs input{width:74px}
.mr-specs select{max-width:172px}
.ai-model-row input,.ai-model-row select{background:var(--panel2);border:1px solid var(--border2);border-radius:5px;padding:4px 7px;font-size:10px;color:var(--text);outline:none;min-width:0;box-sizing:border-box}
.ai-model-row input:focus,.ai-model-row select:focus{border-color:var(--accent)}
.ai-model-use{background:none;border:0;color:var(--dimmer);cursor:pointer;font-size:13px;padding:0;line-height:1;flex:0 0 auto}
.ai-model-use:hover{color:var(--dim)}
.ai-model-use.on{color:var(--accent)}
.ai-model-acts{display:flex;gap:4px;margin-left:auto;flex:0 0 auto}
.ai-model-empty{padding:16px 12px;text-align:center;font-size:10px;color:var(--dimmer);line-height:1.9}

/* —— 小按钮：与 .wc-btn 同族，尺寸更紧凑，用于表格行内与次级动作 —— */
.ai-mini-btn{background:var(--panel2);border:1px solid var(--border2);border-radius:6px;color:var(--dim);font-size:10px;padding:4px 9px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s,background .15s}
.ai-mini-btn:hover{color:var(--text);border-color:var(--accent);background:rgba(125,211,252,.08)}
.ai-mini-btn[disabled]{opacity:.45;cursor:default}
.ai-mini-btn.danger:hover{color:var(--red);border-color:var(--red);background:rgba(224,123,123,.08)}

/* 当前模型条：工作区级的三个思考强度跟着当前模型走 */
.ai-current-strip{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--panel);font-size:10px;color:var(--dimmer)}
.ai-current-strip b{color:var(--text);font-weight:500}
/* 与 Agent 控制台标题行那枚分段控件同款：自绘箭头（原生箭头是系统灰，深色主题里对不上）、
   悬停给底色、焦点用强调色描一圈。两处改同一个设置，看起来就该是同一个控件。 */
.ai-current-strip select{appearance:none;-webkit-appearance:none;background-color:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:3px 22px 3px 7px;font-family:inherit;font-size:10px;color:var(--text);cursor:pointer;outline:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) calc(50% - 1px),calc(100% - 8px) calc(50% - 1px);background-size:4px 4px;background-repeat:no-repeat;transition:border-color .16s ease,background-color .16s ease}
.ai-current-strip select:hover{border-color:var(--border)}
.ai-current-strip select:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.ai-current-strip select option{background:var(--panel2);color:var(--text)}
.ai-probe-note{font-size:10px;color:var(--dimmer);line-height:1.7}

/* 翻译偏好行里的真实控件（此前是只改文本的假开关） */
.tp-input{background:var(--panel2);border:1px solid var(--border2);border-radius:5px;padding:3px 7px;font-size:11px;color:var(--text);outline:none}
.tp-input:focus{border-color:var(--accent)}
.tp-num{width:92px;text-align:right}
.wc-kv .v .tp-input{margin-left:0}
.ai-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.ai-label{font-size:10px;color:var(--dimmer);letter-spacing:.4px}
.ai-label-line{display:flex;align-items:center;gap:8px;min-width:0}
.ai-label-line .ai-mini{margin-left:auto}
.ai-key-status{margin-left:6px;padding:1px 7px;font-size:9px;letter-spacing:.3px;border-radius:8px;border:1px solid var(--border2);color:var(--dimmer)}
.ai-key-status.ok{color:var(--green);border-color:rgba(52,211,153,.35)}
.ai-control{display:flex;gap:8px;align-items:center;min-width:0}
.ai-input{flex:1;min-width:0;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:11px;color:var(--text);outline:none}
.ai-input:focus{border-color:var(--accent)}
.ai-select{display:flex;gap:6px;align-items:center;min-width:0}
.ai-select select{flex:1;min-width:0;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:11px;color:var(--text);outline:none}
.ai-select select:focus{border-color:var(--accent)}
.ai-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai-result{font-size:10px;color:var(--dimmer);word-break:break-all}
.ai-key-actions{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.ai-mini{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10px;color:var(--dim);border-radius:5px;cursor:pointer;transition:color .15s,background .15s}
.ai-mini:hover{color:var(--accent);background:rgba(125,211,252,.06)}
.ai-form{display:none;margin-top:4px;border-top:1px dashed var(--border2);padding-top:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 20px}
.ai-form.open{display:grid}
/* Agent 控制台 tab 面板（宽屏展示完整 prompt/response） */
.agent-panel{display:flex;flex-direction:column;gap:10px;padding:18px 20px;height:100%;min-height:0;font-family:var(--ui)}
.agent-panel-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--accent);letter-spacing:1px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.agent-panel-head .agent-hint{font-size:10px;color:var(--dimmer);font-weight:400;letter-spacing:.3px}
.agent-states{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 16px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--panel2)}
.agent-state-row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
.agent-state-row .as-dot{width:8px;height:8px;border-radius:50%;background:var(--dimmer);flex:0 0 auto}
.agent-state-row.running .as-dot{background:var(--yellow)}
.agent-state-row.done .as-dot{background:var(--green)}
.agent-state-row.failed .as-dot{background:var(--red)}
.agent-state-row b{color:var(--text);font-weight:600;flex:0 0 auto}
.agent-state-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 用量去向（TR-10）：页脚那四个聚合数字回答不了「钱花在哪」，这一段回答。 */
.agent-usage{border:1px solid var(--border);border-radius:8px;background:var(--panel2);padding:10px 14px;display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.agent-usage-head{display:flex;align-items:baseline;gap:10px;font-size:11px;color:var(--accent);font-weight:600}
.agent-usage-total{font-size:10.5px;color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums}
/* 用量行按章增长（一本 203 话的书就有 203 行）。不设内滚动条——两三行高的小框里
   挂一条迷你滚动条既看不全也难滚；改由渲染层只列最近几条，剩余条数写在末行。 */
.agent-usage-rows{display:flex;flex-direction:column;gap:3px}
.au-more{padding-top:3px;font-size:10px;color:var(--dimmer)}
.au-row{display:grid;grid-template-columns:minmax(120px,1.2fr) auto auto auto 1fr;gap:10px;align-items:baseline;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;padding:2px 0}
.au-row b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.au-row .au-note{color:var(--dimmer);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-usage-findings{display:flex;flex-direction:column;gap:3px;font-size:10.5px;line-height:1.6;color:var(--yellow)}
.agent-usage-empty{font-size:10.5px;color:var(--dimmer)}
.agent-calls{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.agent-call{border:1px solid var(--border2);border-radius:8px;background:var(--panel2);padding:10px 14px;font-size:11px;color:var(--dim)}
.agent-call .ac-top{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;user-select:none}
.agent-call .ac-top b{color:var(--accent);font-weight:600;font-size:11px;flex:0 0 auto}
.agent-call .ac-top .ac-meta{color:var(--dimmer);font-size:10px;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-call .ac-preview{margin-top:5px;color:var(--dim);font-size:10.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;max-height:52px;overflow:hidden}
.agent-call .ac-detail{margin-top:7px;border-top:1px dashed var(--border2);padding-top:7px;display:none;flex-direction:column;gap:7px}
.agent-call.open .ac-detail{display:flex}
.agent-call .ac-block{font-size:10.5px;line-height:1.6;color:var(--dim);white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;background:rgba(0,0,0,.18);border-radius:6px;padding:8px 10px}
.agent-call .ac-block b{color:var(--accent);display:block;margin-bottom:3px;font-size:10px;letter-spacing:.5px}

.open-link{font-size:10px;color:var(--accent);opacity:.8}
/* 审校 tab（真实 review.run）。

   三轮全局适配——比同级术语页小 1-3px、用 --ui 字体、严重度色硬编码 Tailwind 旧色。
   现在：中文阅读面统一 var(--cjk)；字号并入 v90 刻度；严重度色经 color-mix 走调色板变量；
   容器宽度/内衬与术语页（.tw-done）同语言。 */
.review-real{display:flex;flex-direction:column;gap:14px;padding:24px 32px;height:100%;min-height:0;overflow:auto;box-sizing:border-box;width:100%;max-width:1060px;margin:0 auto;font-family:var(--cjk)}

.review-real-title p{margin-top:8px;color:var(--dim);font-size:12px;line-height:1.65}
.review-real-actions{flex:0 0 auto}
.review-real-empty{font-size:13px;color:var(--dimmer);padding:24px 11px}
.review-real-count{font-size:12px;color:var(--yellow);font-weight:600;margin-bottom:2px}
.review-real-item{border:1px solid var(--border2);border-radius:8px;background:var(--panel2);padding:11px 14px;margin-bottom:8px}

.review-real-item.review-meaning{border-left:3px solid rgba(251,191,36,.6)}

.rri-top b{color:var(--text);font-size:12px}
.rri-sev{font-size:9px;color:var(--dim);border:1px solid var(--border2);border-radius:8px;padding:1px 6px}
.rri-loc{font-size:10px;color:var(--dimmer);margin-left:auto}
.rri-msg{margin-top:6px;font-size:11px;color:var(--dim);line-height:1.6}
.rri-evidence,.rri-suggest{margin-top:6px;font-size:10px;color:var(--dimmer)}
.rri-evidence code,.rri-suggest code{display:block;margin-top:3px;font-size:10.5px;color:var(--text);background:rgba(0,0,0,.18);border-radius:5px;padding:5px 8px;white-space:pre-wrap;word-break:break-all}
/* 审校问题就地标注（RV-05）：左缘一道细线，不打断阅读 */
.lightee-issue-line{box-shadow:inset 2px 0 0 0 var(--rv-issue,rgba(251,191,36,.55))}
.lightee-issue-high{--rv-issue:color-mix(in srgb,var(--red) 62%,transparent)}
.lightee-issue-medium{--rv-issue:color-mix(in srgb,var(--yellow) 55%,transparent)}
.lightee-issue-low{--rv-issue:color-mix(in srgb,var(--dim) 45%,transparent)}
/* 审校索引列表（RV-05）：总账，可收起 */
.rv-since{font-size:11.5px;color:var(--dimmer)}
/* 失效工作区的出口：注册表保留缺失条目（不静默过滤），但看得见不等于删不掉 */
.wc-forget{flex:0 0 auto;margin-left:8px;font-size:9.5px;color:var(--dimmer);border:1px solid var(--border2);border-radius:8px;padding:1px 8px;cursor:pointer;white-space:nowrap}
.wc-forget:hover{color:var(--red);border-color:var(--red)}
/* 范围声明：先说清「这一步查什么」，再列条目——否则作者只看到一堆判决，

.rv-scope{display:flex;flex-direction:column;gap:4px;padding:10px 13px;border:1px solid var(--border);border-radius:7px;background:var(--panel2)}
.rv-scope>b{font-size:11.5px;font-weight:600;color:var(--text)}
.rv-scope>span{font-size:11.5px;line-height:1.7;color:var(--dimmer)}
.rv-scope>span b{font-weight:600;color:var(--dim)}
/* 逐条判据：每行一句「检查 …」，说清凭什么这么判 */
.rv-scope-list{display:grid;gap:3px;margin:2px 0 0;padding:0 0 0 2px;list-style:none}
.rv-scope-list li{position:relative;padding-left:12px;font-size:11px;line-height:1.7;color:var(--dimmer)}
.rv-scope-list li::before{content:"·";position:absolute;left:2px;color:var(--border2)}
/* 术语表可做的操作 */
.tw-ops{display:grid;gap:3px;margin:0;padding:0;list-style:none;font-size:11px;line-height:1.7;color:var(--dimmer)}
.tw-ops b{color:var(--dim);font-weight:600;margin-right:4px}
/* 判不准的条目补一句怎么判——软件指位置，裁定归作者 */
.rv-issue-hint{margin-top:5px;font-size:11px;line-height:1.65;color:var(--dimmer)}
/* 追溯改名复查队列（EX-06）：窄门外的位置，作者逐处确认 */
.rv-rename{border:1px solid color-mix(in srgb,var(--yellow) 34%,transparent);border-radius:7px;padding:8px 10px;margin:8px 0;background:color-mix(in srgb,var(--yellow) 6%,transparent)}
.rv-rename-head{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.rv-rename-head small{color:var(--dimmer)}
.rv-rename-note{font-size:11.5px;color:var(--dimmer);margin:2px 0 6px}
.rv-rename-item{display:grid;gap:2px;padding:6px 0;border-top:1px solid rgba(83,97,104,.28)}
.rv-rename-where{font-size:11px;color:var(--dimmer)}
.rv-rename-change{font-size:12.5px}
.rv-rename-why{font-size:11.5px;color:var(--dimmer)}
.rv-rename-excerpt{font-size:11.5px;color:var(--dim);white-space:pre-wrap;word-break:break-all}
.rv-rename-item .tw-btn{justify-self:start;margin-top:4px}
.rv-index-head{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.rv-index-head b{color:var(--text);font-weight:600}

.rv-index-toggle{margin-left:auto;flex:0 0 auto;font-size:11px;color:var(--dim);background:transparent;border:1px solid var(--border2);border-radius:8px;padding:2px 9px;cursor:pointer}
.rv-index-toggle:hover{color:var(--text);border-color:var(--dim)}
.rv-index-list{display:flex;flex-direction:column;gap:6px}
.rv-issue{border:1px solid var(--border);border-left-width:3px;border-radius:7px;background:var(--panel2);padding:8px 11px;cursor:pointer;transition:border-color .12s ease}
.rv-issue:hover{border-color:var(--border2)}
.rv-issue.rv-high{border-left-color:color-mix(in srgb,var(--red) 60%,transparent)}
.rv-issue.rv-medium{border-left-color:color-mix(in srgb,var(--yellow) 60%,transparent)}
.rv-issue.rv-low{border-left-color:color-mix(in srgb,var(--dim) 45%,transparent)}
.rv-issue-head{display:flex;align-items:center;gap:8px;font-size:12px}
.rv-issue-head b{color:var(--text);font-size:12.5px;font-weight:600}
.rv-issue-jump,.rv-issue-loc{margin-left:auto;font-size:11px;color:var(--dimmer)}
.rv-issue:hover .rv-issue-jump{color:var(--accent)}
.rv-issue-body{margin-top:5px;font-size:12px;color:var(--dim);line-height:1.65}
.rv-issue-term{margin-top:7px;font-size:11px;color:var(--dim);background:transparent;border:1px solid var(--border2);border-radius:8px;padding:2px 9px;cursor:pointer}
.rv-issue-term:hover{color:var(--text);border-color:var(--dim)}
.rv-passed{padding:16px 11px;font-size:13px;color:var(--dim)}
.rv-passed b{display:block;color:var(--text);font-weight:600;margin-bottom:6px}
.rv-checks summary{font-size:11.5px;color:var(--dimmer);cursor:pointer;list-style:none}
.rv-checks summary::-webkit-details-marker{display:none}
.rv-checks summary:hover{color:var(--dim)}
.rv-check-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rv-check-list span{font-size:11px;color:var(--dimmer);border:1px solid var(--border);border-radius:8px;padding:2px 8px}
/* 全书通读建议（RV-06）：建议不是判决，视觉上比问题条目更轻 */
.review-approval{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.review-approval-loading{font-size:12px;color:var(--dimmer)}
.review-approval-note{font-size:11.5px;color:var(--dimmer);line-height:1.65}
.advice-head-row{display:flex;align-items:center;gap:8px}
.advice-head-row b{font-size:13px;color:var(--text);font-weight:600}
.advice-disclaimer{font-size:10.5px;color:var(--dimmer);border:1px solid var(--border2);border-radius:8px;padding:1px 7px;white-space:nowrap}
.advice-list{display:flex;flex-direction:column;gap:6px}
.advice-item{border:1px solid var(--border);border-radius:7px;background:var(--panel2);padding:8px 11px;cursor:pointer;transition:border-color .12s ease}
.advice-item:hover{border-color:var(--border2)}
.advice-head{display:flex;align-items:center;gap:8px;font-size:12px}
.advice-type{color:var(--text);font-weight:600}
.advice-where{color:var(--dimmer);font-size:11px;margin-left:auto}
.advice-body{margin-top:5px;font-size:12px;color:var(--dim);line-height:1.65}
/* 窄窗适配：审校面板此前一条 media query 都没有（术语页/原型审校页都有） */
@media(max-width:760px){
  .review-real{padding:16px 14px}
  .review-real-head{flex-direction:column;gap:8px}
  .rv-index-breakdown{white-space:normal}
  .advice-where,.rv-issue-loc,.rv-issue-jump{margin-left:0}
}
/* 侧栏术语表真实行 */
.term-mini-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px;font-size:10.5px;border-bottom:1px solid var(--border);color:var(--dim)}
.term-mini-row:last-child{border-bottom:none}
.term-mini-row .tm-ja{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-mini-row b{color:var(--text);font-weight:600;flex:0 0 auto;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-label{font-size:10px;color:var(--dimmer);letter-spacing:.4px}
.ai-control{display:flex;gap:6px;align-items:center;min-width:0}
.ai-input{flex:1;min-width:0;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:6px 9px;font-size:11px;color:var(--text);outline:none}
.ai-input:focus{border-color:var(--accent)}
.ai-select{display:flex;gap:6px;align-items:center;min-width:0}
.ai-select select{flex:1;min-width:0;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:6px 9px;font-size:11px;color:var(--text);outline:none}
.ai-select select:focus{border-color:var(--accent)}
.ai-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ai-result{font-size:10px;color:var(--dimmer);word-break:break-all}
.ai-note{margin-top:8px;font-size:10px;color:var(--dimmer)}
</style>

<div class="terminal" style="position:relative">

<script>
const renderOnlyRuntime=window.__lighteeRenderOnlyRuntime===true;
// ===== 数据 =====
const STYLES={approved:'#4ade80',translated:'#60a5fa',translating:'#fbbf24',ready:'#718096',imported:'#4a5568'};
const LOGO=[
"   ✦  lightee",
"   ───────────",
];
/* 纯框架（作者裁定 2026-08-15）：外壳不再自带任何演示正文。
   从前这里躺着三段小说原文/译文、一份术语表和两条审校样例——独立打开设计稿时
   它们是预览内容，但发布后的软件仓库里不该有任何小说散文，哪怕是自撰的：
   演示散文的存在本身就是「往里粘真书更方便」的斜坡（上一批版权素材正是这么积累的）。
   结构保留、内容清空：所有渲染路径对空数据本来就有对应的空状态。 */
const DEMO_ROWS=[];
const TERMS=[];
const REVIEW_ISSUES={};
const REVIEW_STATUS={};
const REVIEW_INVALIDATED={};
const TRANSLATION_DRAFTS={};
function reviewPendingCount(){return Object.keys(REVIEW_STATUS).filter(paraId=>REVIEW_STATUS[paraId]==='open'&&!REVIEW_INVALIDATED[paraId]).length}
function translationCanEdit(){return chapterPhase==='approved'||chapterPhase==='revising'}
// —— 待审术语卡（v21: 左栏章节下方弹出）——
/* 纯框架：不再自带演示卡（这里从前的样例卡还残留着上一批被清除素材的人名）。
   队列耗尽的空状态是既有 UI，从空开始走的就是它。 */
const PENDING_CARDS=[];
let pendingIdx=0;
let pendingOpen=false;

/**
 * 真实应用判定（RH-12 / renderer-dom-ownership.md §2）。
 *
 * prototype-runtime 是设计稿运行时，它自带一整套 demo 数据（PENDING_CARDS / TERMS /
 * SIM / chapterPhase…）。在设计稿里那是内容，**在真实应用里那是假数据**——它会盖掉
 * workspace-bridge 从 IPC 读来的真实值，用户看到的是「术语待确认 5」「token 2481」
 * 这类凭空出现的数字。
 *
 * 因此：bridge 一旦挂载，任何由 demo 常量推导出来的写入都必须让位。
 * 这不是「尽量避免」——画错的状态比不画更坏，用户没法分辨哪个数字能信。
 */
/**
 * 「我是不是跑在真实应用里」。
 *
 * 判据必须是 preload 注入的 `window.lightee`——它在首帧之前就存在。
 * 曾经用 `__lighteeWorkspaceBridge`，那是 workspace-bridge **异步挂载完**才写的标记，
 * 于是首帧到挂载之间存在一个窗口期：设计稿骨架与 demo 数据会真真切切地渲染出来，
 * 用户看到的是「设计稿骨架：真实应用中此处为快捷设置」这类本不该出现的字。
 * 挂载后的标记保留为兜底（真实应用两者都有；独立打开设计稿两者都没有）。
 */
function lighteeReal(){return typeof window!=='undefined'&&(!!window.lightee||!!window.__lighteeWorkspaceBridge)}

/**
 * 线框小图标。设置界面的标题此前挂的是彩色 emoji（⚙ 🗂 ◈）——它们自带一套
 * 与本界面无关的配色和圆润造型，跟旁边的发丝分隔线、单色 chip 不是同一门语言，
 * 而且在不同系统上长相还不一样。这里改成统一的描边图标：16 视框、1.3 描边、
 * 继承当前文字颜色，跟界面里其他线条同宽。
 */
const UI_ICONS={
  edit:'<path d="M3 13.1h2.4l7.2-7.2-2.4-2.4L3 10.7z"/><path d="M9.9 4.4l2.4 2.4"/>',
  folder:'<path d="M2.2 12.8V3.9h4l1.4 1.7h6.2v7.2z"/>',
  sliders:'<path d="M2 5h12M2 11h12"/><circle cx="5.8" cy="5" r="1.7"/><circle cx="10.2" cy="11" r="1.7"/>',
  translate:'<path d="M1.8 3.2h6.6v4.6H4.9L3 9.6V7.8H1.8z"/><path d="M7.6 6.9h6.6v4.6h-1.3v2l-2-2H7.6z"/>',
  appearance:'<circle cx="8" cy="8" r="5.4"/><path d="M8 2.6a5.4 5.4 0 0 1 0 10.8z" fill="currentColor" stroke="none" opacity=".3"/>',
  chip:'<rect x="4.4" y="4.4" width="7.2" height="7.2" rx="1.2"/><path d="M6.6 2.2v2.2M9.4 2.2v2.2M6.6 11.6v2.2M9.4 11.6v2.2M2.2 6.6h2.2M2.2 9.4h2.2M11.6 6.6h2.2M11.6 9.4h2.2"/>',
  toggle:'<rect x="1.8" y="5" width="12.4" height="6" rx="3"/><circle cx="11.2" cy="8" r="1.9"/>',
  clipboard:'<path d="M5.6 3.2H4a.8.8 0 0 0-.8.8v9.2a.8.8 0 0 0 .8.8h8a.8.8 0 0 0 .8-.8V4a.8.8 0 0 0-.8-.8h-1.6"/><rect x="5.6" y="1.8" width="4.8" height="2.6" rx=".8"/>',
  file:'<path d="M9 1.8H4.6a.8.8 0 0 0-.8.8v10.8a.8.8 0 0 0 .8.8h6.8a.8.8 0 0 0 .8-.8V4.6z"/><path d="M9 1.8v2.8h3.2"/>',
};
function icon(name){return '<svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">'+(UI_ICONS[name]||'')+'</svg>'}

/* 纯框架：计量全部归零。凭空的「token 2481 · 缓存 70%」是假数字，
   真值由 bridge 从 usage 事件里写。 */
const SIM={
  t1:0,t2:0,t3:0,token:0,cache:0,cost:0,hist:[],
  ctx:{term:0,tr1:0,tr2:0,rev:0},
  savedTokens:0,savedCost:0,
};

// v53: 多书模型（书 → 卷 → 章）——同时打开多本书，各书进度独立。
// 纯框架：只留一个空书骨架撑住 BOOKS[currentBook] 的解引用（约 20 处），
// 卷、章、术语全空——真实的树由 bridge 从 workspace.list 画。
const BOOKS={
  'workspace':{title:'工作区',path:'',vols:[]},
  _terms:{},
};
let currentBook='workspace';
// ===== 主界面（B 定案版）：三区 =====
let bTab='terms';
let viewMode='continuous'; // 连续编辑：原文上下文 + 单一译文编辑流
let chapterPhase='terms'; // terms → ready → translating → approved → revising
let authorAction=null;
let authorSelectionBound=false;
let authorInputBound=false;
let termSurface='queue';
let termDirectoryQuery='';

function openChapter(id){
  curChapter=id;
  // 卷归属一律问真实 DOM（同 moveCursor v102 的教训）：
  // 从前问的是 BOOKS 模拟数据，真实工作区里只有恰好与模拟数据同 id 的头两章能对上，
  // 之后的章节要么点亮错的卷、要么一个都不亮，收起的卷也不会自动展开。
  const list=document.getElementById('chapter-list');
  const volId=list?.querySelector('.item[data-cid="'+id+'"]')?.dataset.vol;
  const body=volId?list.querySelector('.vol-body[data-vol="'+volId+'"]'):null;
  const wasClosed=Boolean(body&&!body.classList.contains('open'));
  if(wasClosed)setVolumeOpenById(volId,true);
  syncCurrentVolume();
  const cursor=document.getElementById('ch-cursor');
  if(wasClosed&&cursor)cursor.style.opacity='0';
  if(wasClosed)setTimeout(()=>moveCursor(true),290);
  else moveCursor();
  pushEvent('打开章节 '+id,'act');
}

// v102: 纯 DOM 驱动（不依赖 BOOKS 模拟数据），bridge 真实树也可用
function moveCursor(snap=false){
  const list=document.getElementById('chapter-list');
  const cur=list?list.querySelector('.item[data-cid="'+curChapter+'"]'):null;
  let c=document.getElementById('ch-cursor');
  if(!list)return;
  if(!cur){if(c)c.style.opacity='0';return}
  // 卷是否展开：查 item 所在卷体 .open（真实树/模拟树通用）
  const volId=cur.dataset.vol;
  const volBody=volId?list.querySelector('.vol-body[data-vol="'+volId+'"]'):null;
  const volOpen=volBody?volBody.classList.contains('open'):true;
  if(!volOpen){if(c)c.style.opacity='0';return}
  const fresh=!c;
  if(fresh){
    c=document.createElement('div');
    c.id='ch-cursor';c.className='ch-cursor';
    list.insertBefore(c,list.firstChild);
  }
  const placeWithoutSlide=fresh||snap;
  if(placeWithoutSlide)c.classList.add('placing');
  const lr=list.getBoundingClientRect();
  const cr=cur.getBoundingClientRect();
  c.style.height=Math.round(cr.height)+'px';
  c.style.top=Math.round(cr.top-lr.top+list.scrollTop)+'px';
  if(placeWithoutSlide){
    c.style.opacity='0';
    c.getBoundingClientRect();
    setTimeout(()=>{c.classList.remove('placing');c.style.opacity='1'},0);
  }else c.style.opacity='1';
}

function switchBook(id){

function closeBook(id){

  delete BOOKS[id];

  document.getElementById('book-tabs').innerHTML=renderBookTabs();

function findVol(v){return BOOKS[currentBook].vols.find(x=>x.v===v)}
function findChapter(id){return BOOKS[currentBook].vols.flatMap(x=>x.chapters).find(c=>c.id===id)}
// v60 重写: 编辑交互——DOM 局部替换（不重渲染列表），一次点击即编辑
function beginEdit(kind,id,btn){
  if(!btn)return;
  const titleEl=btn.previousElementSibling;
  if(!titleEl||titleEl.tagName==='INPUT')return;
  const tgt=kind==='vol'?findVol(id):findChapter(id);
  if(!tgt)return;
  if(kind==='vol')editingVol=id;else editingChapter=id; // 防卷折叠/章打开
  const host=btn.closest('.vol-head,.item');
  if(host)host.classList.add('editing');
  const inp=document.createElement('input');
  inp.className='ed-sim';
  inp.value=tgt[kind==='vol'?'name':'title'];
  inp.onclick=(e)=>e.stopPropagation();
  inp.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault();saveEdit(kind,id,inp)}else if(e.key==='Escape'){cancelEdit(kind,id,inp)}};
  inp.onblur=()=>saveEdit(kind,id,inp);
  titleEl.replaceWith(inp);
  btn.style.display='none'; // 原位隐藏 ✎，保存/取消后恢复；不再显示 ✓/✕ 按钮
  inp.focus();inp.select();
}
function saveEdit(kind,id,inp){
  if(!inp||inp.dataset.done)return;
  inp.dataset.done='1';
  const tgt=kind==='vol'?findVol(id):findChapter(id);
  const val=inp.value.trim();
  if(tgt&&val)tgt[kind==='vol'?'name':'title']=val;
  restoreEdit(kind,id,inp,val||(tgt?tgt[kind==='vol'?'name':'title']:''));
  if(kind==='vol')editingVol=null;else editingChapter=null;
  pushEvent('✓ '+(kind==='vol'?'卷名':'章名')+'已更新','ok');
}
function cancelEdit(kind,id,inp){
  if(!inp||inp.dataset.done)return;
  inp.dataset.done='1';
  const tgt=kind==='vol'?findVol(id):findChapter(id);
  restoreEdit(kind,id,inp,tgt?tgt[kind==='vol'?'name':'title']:'');
  if(kind==='vol')editingVol=null;else editingChapter=null;
}
function restoreEdit(kind,id,inp,text){
  // 找到原位隐藏的 ✎（replaceWith 后 inp 脱离 DOM，用 titleEl.nextElementSibling 找回）
  const host=inp.closest('.vol-head,.item');
  if(host)host.classList.remove('editing');
  const titleEl=document.createElement('span');
  titleEl.className=kind==='vol'?'vol-title':'it-title';
  titleEl.textContent=text;
  if(kind==='vol'){
    titleEl.append(' ');
    const mark=document.createElement('span');mark.className='vol-current';mark.textContent='◈';
    titleEl.append(mark);
  }
  inp.replaceWith(titleEl);
  const btn=titleEl.nextElementSibling;
  if(btn&&(btn.classList.contains('vol-edit')||btn.classList.contains('ch-edit')))btn.style.display='';
}

function beginNewChapter(v){
  const book=BOOKS[currentBook];
  const vol=book?.vols.find(x=>x.v===v);
  if(!vol)return;
  // 原型：用内存数据新建占位章节；真实落盘走 IPC（后续接线）。
  const id='ch'+String(Date.now()).slice(-3);
  const chapter={id,title:'新章节',state:'imported',icon:'○'};
  vol.chapters.push(chapter);
  rerenderChapterList();
  setVolumeOpen(vol,true);
  const list=document.getElementById('chapter-list');

// ===== 通用提示系统：所有弹出提示统一显示在标题栏正中 =====
// 用法：
//   showToast('消息')                        → 信息提示（默认 3s）
//   showToast('消息',{duration:5000})        → 自定义时长
//   showToast('已删除…',{undo:fn})           → 带「撤销」按钮（默认 5s，点击执行 undo）
//   window.showToast 供 bridge / 后续模块复用
let toastTimer=null;
function showToast(msg,opts={}){
  const {undo=null,duration=3000}={...opts};
  let t=document.getElementById('titlebar-toast');
  if(!t){t=document.createElement('div');t.id='titlebar-toast';t.className='titlebar-toast';document.body.appendChild(t)}
  t.innerHTML='<span>'+msg+'</span>'+(undo?'<span class="undo-btn">撤销</span>':'');
  t.classList.add('show');
  const btn=t.querySelector('.undo-btn');
  if(btn){btn.onclick=(e)=>{e.stopPropagation();t.classList.remove('show');if(undo)undo()}}
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),duration);
}
// 兼容旧名：带撤销按钮的删除提示（5s）
function showUndoToast(msg,undoFn){
